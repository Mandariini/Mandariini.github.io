<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            background: #f4f4f4;
            color: #222;
        }
        header {
            background: #222;
            color: #fff;
            padding: 2rem 1rem 1rem 1rem;
            text-align: center;
        }
        nav {
            margin: 1rem 0;
        }
        nav a {
            color: #fff;
            margin: 0 1rem;
            text-decoration: none;
            font-weight: bold;
        }
        main {
            max-width: 900px;
            margin: 2rem auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 2rem;
        }
        section {
            margin-bottom: 2.5rem;
        }
        h2 {
            color: #1a73e8;
            margin-top: 0;
        }
        .projects {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }
        .project {
            background: #f9f9f9;
            border-radius: 6px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.04);
            padding: 2rem;
            width: 100%;
            box-sizing: border-box;
        }
        .project h3 {
            margin-top: 0;
        }
        .video {
            margin-top: 1rem;
        }
        iframe {
            width: 100%;
            height: 320px;
            border: none;
            border-radius: 6px;
        }
        @media (max-width: 600px) {
            main { padding: 1rem; }
            .project { padding: 1rem; }
            iframe { height: 180px; }
        }
    </style>
</head>
