<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mandariini</title>
  <meta name="description" content="Mandariini's page. New content coming soon.">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍊</text></svg>">
  <style>
    :root {
      --bg: #f6f4f0;
      --fg: #1d1b18;
      --muted: #6b6660;
      --accent: #f28c28;
      --card: #ffffff;
      --border: #e6e1d9;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141312;
        --fg: #f1ede7;
        --muted: #9c968e;
        --accent: #ff9d3d;
        --card: #1d1b19;
        --border: #2e2b28;
      }
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.5;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      text-align: center;
    }

    .logo {
      font-size: 3rem;
      display: inline-block;
      animation: bob 3s ease-in-out infinite;
    }

    h1 {
      margin: 0.75rem 0 0.25rem;
      font-size: 1.75rem;
      letter-spacing: -0.01em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin: 0.75rem 0 1.25rem;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
    }

    .status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1.6s ease-in-out infinite;
    }

    p {
      color: var(--muted);
      margin: 0 0 1.75rem;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      background: var(--fg);
      color: var(--bg);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: opacity 0.15s;
    }

    a.button:hover {
      opacity: 0.85;
    }

    a.button svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    @keyframes bob {

      0%,
      100% {
        transform: translateY(0) rotate(-4deg);
      }

      50% {
        transform: translateY(-6px) rotate(4deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .logo,
      .status .dot {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="logo" aria-hidden="true">🍊</div>
    <h1>Mandariini</h1>
    <div class="status"><span class="dot"></span> Work in progress</div>
    <p>Something new is coming here soon.<br>In the meantime, check out my GitHub.</p>
    <a class="button" href="https://github.com/mandariini" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" aria-hidden="true">
        <path
          d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
      </svg>
      GitHub
    </a>
  </main>
</body>

</html>
